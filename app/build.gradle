plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.notx.unzip'
    compileSdk 35

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    defaultConfig {
        applicationId 'com.notx.unzip'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
}

chaquopy {
    defaultConfig {
        // Chaquopy supplies the Python runtime inside the APK.
        version = '3.10'
        pip {
            install 'Pillow'
            install 'zstandard'
            // mmh3 is implemented in pure Python in src/main/python/mmh3.py.
        }
    }
}
